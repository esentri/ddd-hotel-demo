plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'io.domainlifecycles.dlc-gradle-plugin' version '2.5.0'
}

repositories {
	mavenCentral()
}



group = 'com.esentri'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dlcGradlePlugin {
	diagram {
		fileOutputDir = layout.buildDirectory
		diagrams{
			[
					diagramSvg {
						domainModelPackages = ["com.esentri"]
						explicitlyIncludedPackages = ["com.esentri"]
						format = "svg"
						fileName = "diagram"
						aggregateRootStyle = "fill=#333333 bold"
					},
					diagramSvg2 {
						domainModelPackages = ["com.esentri"]
						explicitlyIncludedPackages = ["com.esentri"]
						format = "svg"
						fileName = "diagram3"
						aggregateRootStyle = "fill=#333333 bold"
					}
			]
		}
	}
	jsonModel {
		fileOutputDir = layout.buildDirectory
		serializations{
			[
					serial{
						fileName = "model"
						domainModelPackages = ["com.esentri"]
					}
			]
		}
	}
    domainModelUpload {
        domainModelPackages = ["com.esentri"]
        projectName = "ddd-hotel-demo"
        apiKey = "93a6be61-1e98-4079-9076-4ca9daa1614b"
        diagramViewerBaseUrl = "http://localhost:8090"
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.domainlifecycles:spring-boot-starter:2.5.0'
    implementation 'org.springframework:spring-tx:6.1.3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.domainlifecycles:mirror:2.5.0'
	testImplementation 'io.domainlifecycles:domain-diagrammer:2.5.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

repositories {
    mavenLocal()
}







