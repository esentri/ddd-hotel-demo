plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.domainlifecycles.dlc-gradle-plugin' version "${dlcVersion}"
}

group = 'com.esentri'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

configurations.configureEach {
    // Persistenz ueber die DLC JDBC-Integration: der DLC-Starter bringt auch die jOOQ-Integration mit,
    // die sonst Vorrang haette.
    exclude group: 'io.domainlifecycles', module: 'jooq-integration'
    exclude group: 'org.jooq'
}

dependencies {
    // DomainLifeCycles (Mode C: Runtime, inkl. Validation Extender)
    implementation "io.domainlifecycles:spring-boot-starter:${dlcVersion}"

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'com.h2database:h2'

    // @Builder an Aggregaten und Value Objects (DLC-Konvention, wird vom DLC Builder genutzt)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

// Byte Buddy (Validation Extender) laedt einen Java-Agenten zur Laufzeit
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}
tasks.named('bootRun') {
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

// Domaenendiagramme fuer die Dokumentation (README): ./gradlew createDiagram, Ausgabe in docs/images
dlcGradlePlugin {
    diagram {
        fileOutputDir = layout.projectDirectory.dir("docs/images")
        diagrams {
            domaenenmodell {
                domainModelPackages = ["com.esentri.hotel"]
                format = "svg"
                fileName = "domaenenmodell"
            }
            aggregate {
                domainModelPackages = ["com.esentri.hotel"]
                showOnlyAggregateFrames = true
                format = "svg"
                fileName = "aggregate"
            }
            walkIn {
                domainModelPackages = ["com.esentri.hotel"]
                includeFlowsFrom = ["com.esentri.hotel.rezeption.core.application.WalkInService#checkeWalkInEin"]
                format = "svg"
                fileName = "flow-walk-in"
            }
            zimmerauswahl {
                domainModelPackages = ["com.esentri.hotel"]
                includeFlowsFrom = ["com.esentri.hotel.rezeption.core.application.ZimmerService#findeVerfuegbareZimmer"]
                format = "svg"
                fileName = "flow-zimmerauswahl"
            }
            zimmerAnlegen {
                domainModelPackages = ["com.esentri.hotel"]
                includeFlowsFrom = ["com.esentri.hotel.rezeption.core.application.ZimmerService#legeZimmerAn"]
                format = "svg"
                fileName = "flow-zimmer-anlegen"
            }
            checkout {
                domainModelPackages = ["com.esentri.hotel"]
                includeFlowsFrom = ["com.esentri.hotel.rezeption.core.application.BuchungService#checkeAus"]
                format = "svg"
                fileName = "flow-checkout"
            }
        }
    }

    // Upload des Domaenenmodells inkl. statischer Analyse in den DLC Diagram Viewer: ./gradlew domainModelUpload
    // (API-Key aus der Umgebungsvariable DLC_VIEWER_API_KEY, siehe README)
    domainModelUpload {
        diagramViewerBaseUrl = "http://localhost:8090"
        apiKey.set(providers.environmentVariable("DLC_VIEWER_API_KEY"))
        projectName = "hotelverwaltung"
        domainModelPackages = ["com.esentri.hotel"]
        runStaticAnalysis = true
        staticAnalysisPackages = ["com.esentri.hotel"]
    }
}
