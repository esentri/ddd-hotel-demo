plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'io.domainlifecycles.dlc-gradle-plugin' version '3.5.0'
}

repositories {
	mavenCentral()
}

group = 'com.esentri'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	// persistence via DLC's plain JDBC integration: the DLC starter brings the jOOQ integration as well
	all {
		exclude group: 'io.domainlifecycles', module: 'jooq-integration'
		exclude group: 'org.jooq'
	}
}

dlcGradlePlugin {
	domainModelUpload {
		domainModelPackages = ["com.esentri.rezeption"]
		projectName = "DDD-Hotel-Demo-AI-Impl-2"
		apiKey = "c1c780bb-8118-41e7-9643-7d45d2f1ad24"
		diagramViewerBaseUrl = "http://localhost:8090"
		runStaticAnalysis = true
		staticAnalysisPackages = ["com.esentri.rezeption"]
		streamUpload = true
	}
	serializeMirror {
		fileOutputDir = layout.buildDirectory
		serializations{
			[
			serial		{
						domainModelPackages = ["com.esentri.rezeption"]
					}
			]

		}
	}
	diagram {
		fileOutputDir = layout.buildDirectory
		diagrams {
			diagramSvg {
				domainModelPackages = ["com.esentri.rezeption"]
				format = "svg"
				fileName = "diagram"
				aggregateRootStyle = "fill=#333333 bold"
				includeFlowsFrom = ["com.esentri.rezeption.domain.buchung.CheckeGastAus"]
			}
		}
	}

}

dependencies {
	compileOnly 'io.domainlifecycles:dlc-gradle-plugin:3.5.0'
	implementation 'com.h2database:h2:2.4.240'
	implementation 'io.domainlifecycles:spring-boot-starter:3.5.0'
	implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}


repositories {
    mavenLocal()
}







