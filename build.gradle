plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.domainlifecycles.dlc-gradle-plugin' version "${dlcVersion}"
}

group = 'com.esentri'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

configurations.configureEach {
    // Persistenz ueber die DLC JDBC-Integration: der DLC-Starter bringt auch die jOOQ-Integration mit,
    // die sonst Vorrang haette.
    exclude group: 'io.domainlifecycles', module: 'jooq-integration'
    exclude group: 'org.jooq'
}

dependencies {
    // DomainLifeCycles (Mode C: Runtime, inkl. Validation Extender)
    implementation "io.domainlifecycles:spring-boot-starter:${dlcVersion}"

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'com.h2database:h2'

    // @Builder an Aggregaten und Value Objects (DLC-Konvention, wird vom DLC Builder genutzt)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

// Byte Buddy (Validation Extender) laedt einen Java-Agenten zur Laufzeit
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}
tasks.named('bootRun') {
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

dlcGradlePlugin {
    diagram {
        fileOutputDir = layout.buildDirectory
        diagrams {
            domainDiagram {
                domainModelPackages = ["com.esentri.hotel"]
                format = "svg"
                fileName = "domain-diagram"
            }
        }
    }
}
