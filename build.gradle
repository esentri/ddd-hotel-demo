plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'io.domainlifecycles.dlc-gradle-plugin' version '3.1.0'
}

repositories {
	mavenCentral()
}



group = 'com.esentri'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dlcGradlePlugin {
	domainModelUpload {
		domainModelPackages = ["com.esentri.rezeption"]
		projectName = "DDD-Hotel-Demo"
		apiKey = "75ec0596-96ca-4128-a93f-3a1c1ac15e97"
		diagramViewerBaseUrl = "http://localhost:8090"
	}
	serializeMirror {
		fileOutputDir = layout.buildDirectory
		serializations{
			[
			serial		{
						domainModelPackages = ["com.esentri.rezeption"]
					}
					]

		}
	}
	diagram {
		fileOutputDir = layout.buildDirectory
		diagrams {
			diagramSvg {
				domainModelPackages = ["com.esentri.rezeption"]
				format = "svg"
				fileName = "diagram"
				aggregateRootStyle = "fill=#333333 bold"
			}
		}
	}

}

dependencies {
	compileOnly 'io.domainlifecycles:dlc-gradle-plugin:3.1.0'
	implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework:spring-tx:6.1.3'
	implementation 'io.domainlifecycles:types:3.1.0'
	implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.domainlifecycles:mirror:3.1.0'
	testImplementation 'io.domainlifecycles:domain-diagrammer:3.1.0'
}

tasks.named('test') {
	useJUnitPlatform()
}



repositories {
    mavenLocal()
}







