spring.application.name=hotelverwaltung

# Datenbank (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:hotelverwaltung;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Flyway-Migrationen: src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration

# DomainLifeCycles
dlc.features.mirror.base-packages=com.esentri.hotel
dlc.features.persistence.sql-dialect=H2

# OpenAPI (Pflicht fuer die DLC-OpenAPI-Integration)
springdoc.use-fqn=true
