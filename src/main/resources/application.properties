spring.application.name=ddd-hotel-demo

spring.datasource.url=jdbc:h2:file:./build/hotel-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# DLC persistence: plain JDBC backend (no jOOQ), schema is read at runtime after the Flyway migration
dlc.features.persistence.sql-dialect=H2
dlc.features.persistence.jdbc.schema-pattern=PUBLIC

# required by the DLC OpenAPI integration (SpringDoc comes with the DLC starter)
springdoc.use-fqn=true
